[package]
name = "fountain_raptor_q"
version = "1.2.0"
edition = "2024"
authors = ["Zigeng Xu", "Shenghao Yang"]
license = "MIT"
description = "RaptorQ fountain code scheme built on fountain_engine"
repository = "https://github.com/wutongabc/fountain_raptor_q"
documentation = "https://docs.rs/fountain_raptor_q"
keywords = ["fountain-code", "erasure-coding", "raptor-code", "fec", "rfc6330"]
categories = ["algorithms", "encoding", "network-programming"]
readme = "README.md"
include = [
    "src/**",
    "examples/test_single_k_raptor_q.rs",
    "examples/test_all_k_raptor_q.rs",
    "examples/test_all_k_raptor_q_multi_threads.rs",
    "examples/raptor_q_performance.rs",
    "tests/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
fountain_engine = "2.0.1"
fountain_scheme = "2.0.0"
fountain_utility = "2.0.0"
csv = "1.1"
serde = { version = "1.0", features = ["derive"] }
rand = "0.8.5"

[dev-dependencies]
serde_json = "1.0"

[[example]]
name = "test_single_k_raptor_q"
path = "examples/test_single_k_raptor_q.rs"

[[example]]
name = "test_all_k_raptor_q"
path = "examples/test_all_k_raptor_q.rs"

[[example]]
name = "test_all_k_raptor_q_multi_threads"
path = "examples/test_all_k_raptor_q_multi_threads.rs"

[[example]]
name = "raptor_q_performance"
path = "examples/raptor_q_performance.rs"
